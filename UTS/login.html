<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="./CSS/constants.css">
</head>
<body class="bg-beige">
    <section class="login">
        <div class="d-flex justify-content-center align-items-center p-5 min-vh-100">
            <div class="d-flex bg-light w-50 h-50 rounded justify-content-center align-items-center">
                <div class="p-4 w-100">
                    <div class="d-flex justify-content-center">
                       <h1 class="fs-2">LOGIN</h1> 
                    </div>
                    <form id="loginForm" class="d-flex flex-column gap-3 w-100">
                        <div class="w-100">
                            <label for="Email" class="form-label">Email</label>
                            <input type="text" id="Email" name="Email" placeholder="Cake@gmail.com" class="form-control w-100">
                        </div>

                        <div class="w-100">
                            <label for="Password" class="form-label">Password</label>
                            <input type="text" id="Password" name="Password" placeholder="Password" class="form-control w-100">
                        </div>

                        <div class="result"></div>

                        <input type="submit" value="Login" class="btn bg-primary-color text-light w-100">
                    </form>
                    <div class="d-flex justify-content-center p-2">
                        <div class="d-flex flex-column gap-2 text-center">
                            <a href="register.html">Dont have a account?</a>
                            <a href="reset.html">Forgot your account account?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <script type="module" src="./JS/auth.js"></script>
</body>
</html>
