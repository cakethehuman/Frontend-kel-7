<section class="cb-widget" id="cb-widget" aria-label="Asisten Virtual Mie Belitung">
    <p class="cb-teaser" id="cb-teaser">Tanya apa saja soal Mie Belitung! </p>
    <button type="button" class="cb-fab" id="cb-fab" aria-label="Buka chat asisten Mie Belitung" aria-expanded="false" aria-controls="cb-panel">
        <i class="bi bi-chat-heart-fill cb-fab-open"></i>
        <i class="bi bi-x-lg cb-fab-close"></i>
        <span class="cb-dot" id="cb-dot"></span>
    </button>
    <div class="cb-panel" id="cb-panel" role="dialog" aria-labelledby="cb-title" aria-hidden="true">
        <header class="cb-header">
            <div class="cb-avatar" aria-hidden="true"><i class="bi bi-cup-hot-fill"></i></div>
            <div class="cb-head-text">
                <h2 class="cb-title" id="cb-title">Asisten Mie Belitung</h2>
                <p class="cb-status"><span class="cb-status-dot"></span> Online, siap membantu</p>
            </div>
            <div class="cb-head-actions">
                <button type="button" class="cb-icon-btn" id="cb-search-toggle" aria-label="Cari di riwayat chat"><i class="bi bi-search"></i></button>
                <button type="button" class="cb-icon-btn" id="cb-clear" aria-label="Hapus semua riwayat chat"><i class="bi bi-trash3"></i></button>
                <button type="button" class="cb-icon-btn" id="cb-close" aria-label="Tutup chat"><i class="bi bi-dash-lg"></i></button>
            </div>
        </header>
        <div class="cb-search cb-hidden" id="cb-search-bar">
            <label for="cb-search" class="cb-sr">Cari pesan</label>
            <input type="search" class="cb-search-input" id="cb-search" placeholder="Cari kata kunci..." autocomplete="off">
            <button type="button" class="cb-star-filter" id="cb-star-filter" aria-pressed="false" aria-label="Tampilkan hanya yang ditandai">
                <i class="bi bi-star-fill"></i> Ditandai
            </button>
            <span class="cb-count" id="cb-count" role="status"></span>
        </div>
        <div class="cb-clear-bar cb-hidden" id="cb-clear-bar">
            <span>Hapus semua riwayat chat?</span>
            <div class="cb-clear-actions">
                <button type="button" class="cb-mini-btn cb-mini-danger" id="cb-clear-yes">Ya, hapus</button>
                <button type="button" class="cb-mini-btn" id="cb-clear-no">Batal</button>
            </div>
        </div>
        <div class="cb-body" id="cb-messages" aria-live="polite">
            <div id="cb-list"></div>
            <div class="cb-typing cb-hidden" id="cb-typing" aria-label="Asisten sedang mengetik">
                <span class="cb-typing-dot"></span>
                <span class="cb-typing-dot"></span>
                <span class="cb-typing-dot"></span>
            </div>
            <div class="cb-empty cb-hidden" id="cb-empty">
                <i class="bi bi-emoji-neutral"></i>
                <p>Tidak ada pesan yang cocok.</p>
            </div>
        </div>
        <div class="cb-chips" id="cb-chips" aria-label="Saran pertanyaan"></div>
        <form class="cb-form" id="cb-form" novalidate>
            <label for="cb-input" class="cb-sr">Tulis pertanyaanmu</label>
            <input type="text" class="cb-input" id="cb-input" placeholder="Tulis pertanyaanmu di sini..." maxlength="200" autocomplete="off">
            <button type="submit" class="cb-send" id="cb-send" aria-label="Kirim pesan"><i class="bi bi-send-fill"></i></button>
        </form>
    </div>
</section>
