<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Profile Mie Belitung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/constants.css">
    <link rel="stylesheet" href="CSS/footer.css">
    <link rel="stylesheet" href="CSS/profile.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="JS/navbar.js" defer></script>
    <script src="JS/footer.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-beige">
     
    <div id="navbar-placeholder"></div>

    <main class="pf-page">

        <section class="pf-hero container" aria-labelledby="pf-name">
            <div class="row g-4">

                <div class="col-lg-4">
                    <article class="pf-card pf-id-card h-100">
                        <figure class="pf-cover m-0">
                            <img src="IMG/mie_belitung_muantap.webp" alt="Mie Belitung, kuliner favorit utama" class="pf-cover-img">
                            <figcaption class="pf-cover-caption"><i class="bi bi-heart-fill"></i>Favorit Utama</figcaption>
                        </figure>
                        <div class="pf-avatar" id="pf-avatar" aria-hidden="true">M</div>
                        <div class="pf-id-body text-center">
                            <h1 class="pf-name" id="pf-name">Haplista</h1>
                            <p class="pd-email" id="pf-email">haplista@gmail.com</p>
                            <p class="pf-loc"><i class="bi bi-geo-alt-fill"></i>Jakarta, Indonesia</p>
                            <button type="button" class="btn btn-profile" data-bs-toggle="modal" data-bs-target="#editModal">
                                <i class="bi bi-pencil-square"></i> Edit Profil
                            </button>
                        </div>
                    </article>
                </div>

                <div class="col-lg-8 d-flex flex-column gap-4">
                    <article class="pf-card pf-bio">
                        <p class="pf-label">Tentang Saya</p>
                        <h2 class="pf-title">Penjelajah Rasa Nusantara</h2>
                        <p class="pf-bio-text" id="pf-bio-text"></p>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="pf-tag">#MieBelitung</span>
                            <span class="pf-tag">#PemburuRasa</span>
                            <span class="pf-tag">#KulinerNusantara</span>
                        </div>
                    </article>

                    <div class="row g-3">
                        <div class="col-12 col-sm-4">
                            <article class="pf-card pf-stat">
                                <i class="bi bi-bookmark-heart-fill"></i>
                                <div class="pf-stat-num" id="stat-total">0</div>
                                <div class="pf-stat-label">Total Favorit</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-4">
                            <article class="pf-card pf-stat">
                                <i class="bi bi-bookmark-heart-fill"></i>
                                <div class="pf-stat-num" id="stat-total">0</div>
                                <div class="pf-stat-label">Sudah Dicoba</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-4">
                            <article class="pf-card pf-stat">
                                <i class="bi bi-bookmark-heart-fill"></i>
                                <div class="pf-stat-num" id="stat-total">0</div>
                                <div class="pf-stat-label">Total Favorit</div>
                            </article>
                        </div>
                    </div>

                    <aside class="pf-card pf-progress" aria-label="Progres jelajah kuliner">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold">Progres Jelajah Kuliner</span>
                            <span class="pf-progress-text" id="pf-progress-text">0%</span>
                        </div>
                        <div class="progress" role="progressbar" aria-label="Progres jelajah" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="pf-progress">
                            <div class="progress-bar" id="pf-progress-bar" style="width: 0%"></div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>







        
    </main>
    
</body>
</html>
