<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Profile Mie Belitung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/constants.css">
    <link rel="stylesheet" href="CSS/footer.css">
    <link rel="stylesheet" href="CSS/profile.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="JS/navbar.js" defer></script>
    <script src="JS/footer.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-beige">
     
    <div id="navbar-placeholder"></div>

    <main class="pf-page">

        <section class="pf-hero container" aria-labelledby="pf-name">
            <div class="row g-4">

                <div class="col-lg-4">
                    <article class="pf-card pf-id-card h-100">
                        <figure class="pf-cover m-0">
                            <img src="IMG/mie_belitung_muantap.webp" alt="Mie Belitung, kuliner favorit utama" class="pf-cover-img">
                            <figcaption class="pf-cover-caption"><i class="bi bi-heart-fill"></i>Favorit Utama</figcaption>
                        </figure>
                        <div class="pf-avatar" id="pf-avatar" aria-hidden="true">M</div>
                        <div class="pf-id-body text-center">
                            <h1 class="pf-name" id="pf-name">Haplista</h1>
                            <p class="pd-email" id="pf-email">haplista@gmail.com</p>
                            <p class="pf-loc"><i class="bi bi-geo-alt-fill"></i>Jakarta, Indonesia</p>
                            <button type="button" class="btn btn-profile" data-bs-toggle="modal" data-bs-target="#editModal">
                                <i class="bi bi-pencil-square"></i> Edit Profil
                            </button>
                        </div>
                    </article>
                </div>



            </div>
        </section>
    </main>
    
</body>
</html>
