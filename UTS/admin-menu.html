<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/constants.css">
</head>
<body class="bg-beige">
  <div class="container-fluid">
    <div class="row min-vh-100">
      <div id="admin-navbar" class="col-md-3 col-lg-2 p-0"></div>

      <main class="col-md-9 col-lg-10 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="h4 mb-0">Admin Menu</h2>
          <span class="text-secondary small">admin@example.com</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="btn-group btn-group-sm" role="group" aria-label="Filter by category">
            <button type="button" class="btn bg-primary-color text-white" data-category="all">All</button>
            <button type="button" class="btn btn-outline-secondary" data-category="main">Main</button>
            <button type="button" class="btn btn-outline-secondary" data-category="drink">Drinks</button>
            <button type="button" class="btn btn-outline-secondary" data-category="other">Other</button>
          </div>
          <button class="btn bg-primary-color btn-sm text-white" data-bs-toggle="modal" data-bs-target="#itemModal">Add item</button>
        </div>

        <div class="table-responsive bg-white border rounded">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr><th>Name</th><th>Category</th><th class="text-end">Price</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody id="menu-items">
              <tr data-category="main">
                <td>Mie Belitung Special</td>
                <td><span class="badge bg-primary-color">main</span></td>
                <td class="text-end">Rp 25.000</td>
                <td class="text-end">
                  <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#itemModal">Edit</button>
                  <button class="btn btn-outline-danger btn-sm">Delete</button>
                </td>
              </tr>
              <tr data-category="drink">
                <td>Es Teh Manis</td>
                <td><span class="badge text-bg-secondary">drink</span></td>
                <td class="text-end">Rp 6.000</td>
                <td class="text-end">
                  <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#itemModal">Edit</button>
                  <button class="btn btn-outline-danger btn-sm">Delete</button>
                </td>
              </tr>
              <tr data-category="other">
                <td>Kerupuk</td>
                <td><span class="badge text-bg-secondary">other</span></td>
                <td class="text-end">Rp 3.000</td>
                <td class="text-end">
                  <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#itemModal">Edit</button>
                  <button class="btn btn-outline-danger btn-sm">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>

    </div>
  </div>

  <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="itemModalLabel">Menu item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="item-id">
          <div class="mb-3">
            <label for="item-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="item-name">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="item-category" class="form-label">Category</label>
              <select class="form-select" id="item-category">
                <option value="main">Main</option>
                <option value="drink">Drink</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-6">
              <label for="item-price" class="form-label">Price (Rp)</label>
              <input type="number" class="form-control" id="item-price" min="0" step="500">
            </div>
          </div>
          <div class="mb-1">
            <label for="item-description" class="form-label">Description</label>
            <textarea class="form-control" id="item-description" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn bg-primary-color btn-sm text-white" id="save-item">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/admin-navbar.js"></script>
</body>
</html>
