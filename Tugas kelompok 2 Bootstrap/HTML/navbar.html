<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Responsif Bootstrap</title>
    
    <!-- WAJIB: Hanya gunakan link Bootstrap ini. Jangan tambahkan link ke navbar.css lagi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <!-- py-3 (HP), py-4 (Tablet), py-5 (Desktop) mengatur tinggi header secara responsif -->
    <!-- bg-secondary memberikan warna background abu-abu standar Bootstrap -->
    <nav class="navbar bg-secondary py-2 d-flex align-items-center justify-content-between w-100">
        
        <div class="logo d-flex justify-content-center align-items-center ms-3 ms-md-4 ms-lg-5">
            <img src="../Images/cafe.jpg" alt="coffee logo" width="50" height="50" class="rounded-circle">
        </div>

        <!-- gap-2 (HP), gap-3 (Tablet), gap-4 (Desktop) mengatur jarak antar menu -->
        <ul class="list-unstyled d-flex m-0 me-3 me-md-4 me-lg-5 gap-2 gap-md-3 gap-lg-4">
            <li>
                <!-- fs-5 (HP), fs-4 (Tablet), fs-3 (Desktop) memperbesar ukuran teks -->
                <!-- btn btn-outline-dark border-0 digunakan untuk memberikan efek hover -->
                <a href="index.html" class="btn btn-outline-dark border-0 text-white fs-5 fs-md-4 fs-lg-3 px-2 px-md-3 py-1 py-md-2 rounded d-flex justify-content-center align-items-center">Home</a>
            </li>
            <li>
                <a href="menu.html" class="btn btn-outline-dark border-0 text-white fs-5 fs-md-4 fs-lg-3 px-2 px-md-3 py-1 py-md-2 rounded d-flex justify-content-center align-items-center">Menu</a>
            </li>
            <li>
                <a href="career.html" class="btn btn-outline-dark border-0 text-white fs-5 fs-md-4 fs-lg-3 px-2 px-md-3 py-1 py-md-2 rounded d-flex justify-content-center align-items-center">Karir</a>
            </li>
        </ul>
    </nav>

    <!-- Script Bootstrap 5 (Menggantikan 3 baris script lama yang menyertakan jQuery) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
