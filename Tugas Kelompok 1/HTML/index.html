<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <title>Statistic Calculator</title>
</head>
<body>
    <nav align="center">
        <a href="index.html">Home</a>
        <a href="profile.html">About Us</a>
    </nav>

    <header>
        <h1 align="center"><strong>Statistic Calculator</strong></h1>
    </header>
    
    <div class="content-container">
        <div class="form-box">
            <form action="" method="POST">
                <textarea name="angka_input" cols="70" rows="4" placeholder="Masukkan angka, harap dipisahkan dengan koma.."></textarea>

                <div class="button-group">
                    <button type="submit" class="button-calculate">
                        Calculate 
                        <span style="background: rgba(255,255,255,0.2); border-radius: 50%; width: 25px; height: 25px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px;">▶</span>
                    </button>
                    <button type="reset" class="button-clear">
                        Clear
                    </button>
                </div>
            </form>     
        </div>

        <div class="result">
        </div>
    </div>
</body>
</html>
